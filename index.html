<html lang="en">
<head>

<link rel="stylesheet" href="css/style.css?v=2026-11-20.4">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="logo">FS</span><span id="brandName">FLL SIM</span></a>
  <nav class="tabs" id="tabs">
    <a href="#/" data-r="">Home</a>

</header>
<main id="view"></main>
<footer><span id="footName">FLL SIM</span> · built for SPIKE Prime + Pybricks · not affiliated with FIRST® or LEGO®</footer>
<script>
// Make sure everyone gets the newest files after an update (GitHub Pages caches them for 10 min)
(async () => {
  const V = '2026-11-20.4';
  const files = ["js/ai.js", "js/app.js", "js/config.js", "js/fieldview.js", "js/omni.js", "js/pages/account.js", "js/pages/admin.js", "js/pages/builder.js", "js/pages/code.js", "js/pages/comps.js", "js/pages/field.js", "js/pages/home.js", "js/pages/rules.js", "js/pages/sim.js", "js/pages/soccer.js", "js/physics.js", "js/py-worker.js", "js/pybricks-export.js", "js/robot.js", "js/store.js", "js/pybricks-mock.py", "css/style.css"];
  try {
    if (localStorage.getItem('fllsim.v') !== V) {
      await Promise.all(files.map(f => fetch(f, { cache: 'reload' }).catch(() => {})));
      localStorage.setItem('fllsim.v', V);
      if (!sessionStorage.getItem('fllsim.reloaded')) { sessionStorage.setItem('fllsim.reloaded', '1'); location.reload(); return; }
    }
  } catch (e) { }
  sessionStorage.removeItem('fllsim.reloaded');
  const s = document.createElement('script'); s.type = 'module'; s.src = 'js/app.js'; document.body.appendChild(s);
})();
</script>
</body>
</html>
